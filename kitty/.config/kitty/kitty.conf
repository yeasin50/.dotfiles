# ~/.config/kitty/kitty.conf

# ── Font ────────────────────────────────────────────────
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
font_size 14


# ── Shell ───────────────────────────────────────────────
shell /bin/bash --login

# ── Appearance ─────────────────────────────────────────
background_opacity 0.85
enable_audio_bell no
cursor_shape beam
tab_bar_edge top
window_margin_width 4
scrollback_lines 10000

# ── Remote Control ─────────────────────────────────────
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Colors: Midnight Teal ───────────────────────────────
background #0e1112
foreground #c5d0d3

cursor #a6e3e9
cursor_text_color #0e1112

selection_background #354448
selection_foreground #e5f0f2

# ANSI
color0  #151a1c
color1  #f38ba8
color2  #a6d189
color3  #e5c890
color4  #8caaee
color5  #ca9ee6
color6  #81c8be
color7  #c5d0d3

# Bright colors
color8  #626c70
color9  #ff657a
color10 #b6e3a0
color11 #f2d5a0
color12 #a3c4ff
color13 #d8a5f5
color14 #8de0d0
color15 #f0f4f5

# Tabs
active_tab_background #81c8be
active_tab_foreground #0e1112
inactive_tab_background #202729
inactive_tab_foreground #a2abaf
