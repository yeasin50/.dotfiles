# ~/.config/kitty/kitty.conf

# ── Font ────────────────────────────────────────────────
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
font_size 14


# ── Shell ───────────────────────────────────────────────
shell /bin/bash --login

# ── Appearance ─────────────────────────────────────────
background_opacity 0.85
enable_audio_bell no
cursor_shape beam
tab_bar_edge top
window_margin_width 4
scrollback_lines 10000

# ── Remote Control ─────────────────────────────────────
allow_remote_control yes
listen_on unix:/tmp/kitty

# ── Colors: Midnight Teal ───────────────────────────────
background #0e1112
foreground #a2abaf

cursor #bdc7cc
cursor_text_color #0e1112

selection_background #283133
selection_foreground #d0dbe0

# ANSI
color0  #090a0b
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #abb2bf

# Bright colors
color8  #5c6370
color9  #ff7a85
color10 #b1e58b
color11 #ffd580
color12 #79c0ff
color13 #d99aff
color14 #70d9e5
color15 #ffffff

# Tabs
active_tab_background #283133
active_tab_foreground #d0dbe0
inactive_tab_background #151a1c
inactive_tab_foreground #a2abaf
